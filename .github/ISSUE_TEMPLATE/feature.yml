name: Feature request
description: Propose a change to the library, CLI, or playground.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API, flag, or behaviour you would like. Note whether it is spec behaviour (validator) or policy (linter).
    validations:
      required: true
