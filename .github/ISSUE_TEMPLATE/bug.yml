name: Bug report
description: The validator or linter reports something wrong, or crashes.
labels: [bug]
body:
  - type: textarea
    id: tokens
    attributes:
      label: Minimal tokens JSON
      description: The smallest document that shows the problem.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What the spec says should happen, with a section link if possible.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The issue codes and messages you got (CLI output or playground).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version and Node version
    validations:
      required: true
