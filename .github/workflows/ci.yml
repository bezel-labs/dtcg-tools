name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx turbo run lint typecheck test build
      - run: npx biome ci .
      - name: Published package has zero runtime dependencies
        run: npm ls --omit=dev --workspace open-design-tokens
      - name: Package types resolve for every entry
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run attw
      - name: Bundle size budgets
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run size
      - name: Benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          npm run bench | tee bench.txt
          { echo '### Benchmarks'; echo; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          node -e '
            const t = require("./packages/open-design-tokens/coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
            console.log("### Coverage\n\n| Metric | Covered |\n|---|---|\n" + ["lines","branches","functions","statements"].map(row).join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
