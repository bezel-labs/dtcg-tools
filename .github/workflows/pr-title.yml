name: PR title

# Pull requests are squash-merged with the title as the commit message, so the
# title must follow Conventional Commits. This reads only the event payload and
# never checks out code, so it is safe for pull requests from forks.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title follows Conventional Commits
        env:
          # Passed through the environment, never interpolated into the script,
          # so a crafted title cannot inject shell commands.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [^ ].{0,98}$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Title OK: $TITLE"
          else
            echo "::error title=Pull request title::The title must follow Conventional Commits, for example 'fix: accept --no-color in the CLI' or 'feat(linter): add a rule'. Allowed types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test. Got: $TITLE"
            exit 1
          fi
