name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Choose the base path
        # With a custom domain (apps/demo/public/CNAME) the site is served from "/";
        # without one GitHub serves it under the repository name.
        run: |
          if [ -f apps/demo/public/CNAME ]; then echo "VITE_BASE=/" >> "$GITHUB_ENV"; else echo "VITE_BASE=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_ENV"; fi
      - run: npx turbo run build --filter=demo --filter=docs
      - name: Build the API reference into the site
        run: npm run docs:api
      - name: Add the documentation site under /docs
        run: |
          rm -rf apps/demo/dist/docs
          cp -R apps/docs/out apps/demo/dist/docs
          touch apps/demo/dist/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
